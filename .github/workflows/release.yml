name: Build and publish Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build Windows executable
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name "PosterPrint-Pro"
          --icon "app_icon.ico"
          --add-data "app_icon.png;."
          poster_app.py

      - name: Publish executable to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          name: PosterPrint Pro ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/PosterPrint-Pro.exe
